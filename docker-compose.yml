version: "3.8"

services:
  mysql:
    image: mysql:8
    container_name: trello-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Cateye%69
      MYSQL_DATABASE: trello_clone
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    depends_on:
      - mysql

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data: